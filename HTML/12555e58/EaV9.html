<!--

Listas 

Nos ayudan a estructura informacion ordenada y no ordenada.

Ordenadas-> Llevan numeracion y la sintaxis es:

<al>...</al>

No ordenadas -> Llevan bullets o viñetas y la sintaxis es:

<ul>...</ul>

Para los elementos deista se usa la sintaxis:

<li>...</li>

Existe el atributo "type" que nos permite cambiar el tipo de numeracion y bullet de las listas.

1...Type"1" (numeros)
A...Type"el alfabeico"
I...Type"tipo romano" 

Para las listas no ordenadas los valores son:
disc...balas o puntitos (default)
circle...circulos
square...cuadrado 

-->
<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8"
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>listas</title>
</head>
<body>
    <h1>Listas</h1>
    <p>Tenemos listas ordenas y no ordenadas</p>

    <h2>mi comida favorita</h2>
    <ol type="i"
    <li>Raviolez</li>
    <li>Arroz</li>
    </ol>

    <h2>Mis artistas favoritosz</h2>
    <ul>
    <li>Blackpink</li>
    <li>Camila Cabello</li>
    <li>Giveon</li>
    <li>Zayn</li>
    <li>Daniel caesar</li>
    <li>SZA</li>
    <li>New jeans</li>
    </ul>
</body>
</html>
