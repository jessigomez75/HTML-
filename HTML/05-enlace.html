<!--

Enlaces 

Los enlaces nos permiten crear navegaciones internas y externas html.

sintaxis

<a>...</a>

Los enlaces requieren del atributo "href" para funcionar como los elementos de navegacion.
<a href="..."></a>

El atributo "hrfe" puede recibir varios valores, entre ellos:
Url externa
La ruta (path)

-->
    <!DOCTYPE HTML>
    <html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-sca">
    <title>Enlace</title>
</head>
<body>
<a href="https://www.tiktok.com">Esto es un enlace externo</a>

<a href="04 etiquetas-texto.html">Esto es un enlace interno</a>

<a href="#jkaylove">Esto es un enlace hacia un elemento de html</a>

<br>

<h2 id="jkaylove">elemento para enlace</h2>

</body>
    </html>
