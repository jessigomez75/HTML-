<!--

 LK Para crear la estructura basica podemos usar Emmet.

 Emmet es una herramienta de autocompleto integrado VSHC.

 El shortcut para escribir la estructura: !

 tributos 

 lang-> Determina el idioma en que esta escrito el documento.
 harset-> Determina el conjunto de caracteres que se usa en el documento.

 Etiquetas 

 Meta viewport ->Permite que nuestro documento se vea correctamente en dispositivos moviles. Siempre debe estar.

 Title -> Define el titulo del documento. Este titulo si es visible para el usuario y se muestra en las pestañas del navegador.


-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dormir</title>
</head>
<body>
    
</body>
</html>
