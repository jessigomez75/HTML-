<!--

 Formularios 

 Son elemntos que permiten el ingreso de informacion por parte del usuario.

 Para el contenedor de un formulario se usa: 

 <form>...</form>

 Dentro de este elemento se colocan los campos (fields) y etiqueta (labels)

 <input /> Campo de acceso de una informacion. Son elementos self closing. Y hay de diferentes tipos texto, boton, chekbox, etc...

 <label>...</label> estas etiquetas se asocian a un input.

 Parametros 
 
 para label:
      for -indica la relacion con el imput. 
 para input:
        type -indica el tipo de campo  
        name -indica el nombre del campo con el que se relaciona el label 
        placeholder -indica un texto de ejemplo para el campo. 
        id -indica para programar y validar el formulario.

        otros elementos que se usan en el formulario son:
        <textarea>...</textarea> - es un campo de texto mas grande o para textos largos.
        
otros elementos 
-->
 
<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

<h1>Formulario</h1>

<form>
    <label for="nombre">Nombre:</label>
    <input type="text" name="ya vamonos" placeholder="miu schuet" id="lenalalina"/>
    <textarea name="" id=""></textarea>



</html>
</html>
