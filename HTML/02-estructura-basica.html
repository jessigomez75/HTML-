<!--

Estuctura basica 

<!DOCTYPE html>.-> Declara el tipo de documento y la version de HTML que estamos utilizando.

<html>->Es el "elemento" raiz que contiene todo el contenido del documento

<head>->Contiene metadatos sobre el documento, p. ej. conjunto de caracteres, vista para dispositivos moviles o el titulo del documento.

<bidy>->Contiene el contenido visible del documento, como titulos, parrafos, imagenes, formularios...

-->

<!DOCTYPE html>
<html>
    <head></head>
    <body></body>
</html>
