<!--

Imagenes

Para colocar imagenes dentro de html usamos la etiqueta:

<img />
Esta etiqueta es de autocierre (self closing). En html S la / ya no es necesaria, pero se considera una buena practica utilizarla.

El atributo "src" (source u origen) Le indica a la etiqueta la imagen a mostrar. Puede recibir una url externa o la ruta (pat) interna.

El atributo "alt" (alternative text o texto alternativo) es un texo que se mostrara en caso de que la imagen no puede ser renderizado por el navegador. Este atriuto es el obligatorio, porque se utiliza como apoyo en accecibilidad.


-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1>Imagenes</h1>
    <p>Las imagenes nos permiten colocar elementos visuales en los sitios web</p>

    <h2>Imagenes externas</h2>
    <img />

    <h2> Imagen Interna</h2>
    <img src="https://picsum.photos/seed/picsum/200/300" alt= imagen aleatoria desde Lorempicsum.com />

    <h2>Imagenes internas</h2>
    <img src="miumiusuet.jpg" alt="Actriz tailandesa que es el segundo amor de mi vida"/>

</body>
</html>
