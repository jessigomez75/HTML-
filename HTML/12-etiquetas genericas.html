<!--

Etiquetas Genericas 

Existen dos que nos ayudan a crear elementos de tipo bloque y linea

div. se usa como un contenedor de division y semantica no significa nada.Sirve para contenedor de bloque.

Spam Ses un contenedor de tipo linea, se suele usar para encerrar palabras o pequeños textos. Semanticas no significa nada.

Contenedor de bloque - Ocupan todo el ancho disponible y daran un salto de linea.

Contendor de linea - Va a ocupar el ancho de su contenido y no da salto de linea. 

-->
